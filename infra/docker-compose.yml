# Servicios para desarrollo local: `make up`
services:
  postgres:
    image: postgres:16
    environment:
      # Sin contraseñas en el repo: trust, y el puerto solo escucha en localhost.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  pgdata:
