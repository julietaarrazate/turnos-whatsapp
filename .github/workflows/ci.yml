name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Fijo como en backup.yml: ubuntu-latest pasó a 26.04, que ya no trae postgresql-client-16.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Roles y bases de datos
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../infra/postgres/init.sql
      - name: Librerías de WeasyPrint (PDF) y cliente de Postgres 16 (backup)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core postgresql-client-16
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Límites entre módulos
        run: uv run lint-imports && uv run python scripts/check_module_boundaries.py
      - name: Migraciones (upgrade, check, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Motor de pricing (100 % de ramas)
        run: uv run pytest tests/pricing -p no:cacheprovider --cov=app.domain.pricing --cov-branch --cov-fail-under=100
      - name: Tests
        env:
          PG_BINDIR: /usr/lib/postgresql/16/bin  # la versión del servidor (scripts/backup.py)
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  contract:
    # El frontend usa tipos generados desde el OpenAPI del backend: si el contrato cambió y no
    # se regeneraron, falla acá y no en producción.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd backend && uv sync --frozen
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm gen:api
      - name: El contrato commiteado está al día
        run: git diff --exit-code -- frontend/src/lib/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    # Construye la imagen de producción de la API y verifica que arranca.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api:ci backend
      - name: La imagen genera PDF (WeasyPrint con Pango y fuentes)
        run: |
          docker run --rm -e PYTHONWARNINGS=error::DeprecationWarning:weasyprint api:ci python -c "
          from weasyprint import HTML
          pdf = HTML(string='<p>Propuesta ñandú — áéí</p>').write_pdf()
          assert pdf.startswith(b'%PDF'), pdf[:10]
          print('PDF OK', len(pdf))"
      - name: El contenedor arranca y responde /healthz
        run: |
          docker run -d --name api -p 8000:8000 -e ENV=local api:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/healthz && exit 0; sleep 1; done
          docker logs api
          exit 1

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    # Dependencias con vulnerabilidades conocidas (ARCHITECTURE §8.7). Lee los lockfiles, no instala
    # nada. Falla con severidad alta o crítica en el frontend y con cualquiera en el backend
    # (pip-audit no distingue severidad). Dependabot abre los PR de actualización.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend (pnpm audit)
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Backend (pip-audit, incluye herramientas de desarrollo)
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off
