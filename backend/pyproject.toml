[project]
name = "app"
version = "0.1.0"
description = "Backend de la plataforma para productoras de eventos"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "email-validator>=2.4.0",
    "sqlalchemy>=2.1.9",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.13",
    "httpx>=0.27",
    "weasyprint>=66",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "boto3>=1.44.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.170.17",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "import-linter>=2.17",
    "pypdf>=5",
    "moto[s3]>=5.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "SIM", "RUF", "PL", "PT"]
ignore = [
    "PLR0913",  # FastAPI endpoints receive many dependencies
    "PLR2004",  # magic values in tests and HTTP codes
    "B008",     # Depends() in defaults is the FastAPI idiom
    "RUF001", "RUF002", "RUF003",  # Spanish text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"migrations/**" = ["E501"]
"scripts/**" = ["T201", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["argon2.*", "weasyprint.*", "openpyxl.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio puro no depende de la app ni de frameworks"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.core", "app.modules", "fastapi", "sqlalchemy", "starlette"]

[[tool.importlinter.contracts]]
name = "core no depende de los módulos"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]
